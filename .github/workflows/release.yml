name: Release Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # Secrets cannot be read in `if:` conditions, so expose only whether they are configured.
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
      HAS_UPDATE_SIGNING_KEY: ${{ secrets.PB_UPDATE_SIGNING_KEY != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust stable (MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.5
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit npm dependencies (high/critical)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Verify versions match (tag, package.json, Cargo.toml, tauri.conf.json, version.ts)
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          grep -q "^version = \"$v\"" src-tauri/Cargo.toml || { echo "Cargo.toml version != $v"; exit 1; }
          grep -q "\"version\": \"$v\"" src-tauri/tauri.conf.json || { echo "tauri.conf.json version != $v"; exit 1; }
          grep -q "\"$v\"" src/version.ts || { echo "src/version.ts version != $v"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$v" ]]; then echo "Tag $GITHUB_REF_NAME != v$v"; exit 1; fi

      - name: Typecheck and lint frontend
        run: |
          npm run typecheck
          npm run lint

      - name: Run Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # Optional Authenticode signing. Set the WINDOWS_CERTIFICATE (base64 .pfx) and
      # WINDOWS_CERTIFICATE_PASSWORD secrets to enable it; without them the installer is unsigned.
      - name: Import code signing certificate
        if: env.HAS_WINDOWS_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $conf.bundle.windows | Add-Member -NotePropertyName certificateThumbprint -NotePropertyValue $cert.Thumbprint -Force
          $conf.bundle.windows | Add-Member -NotePropertyName digestAlgorithm -NotePropertyValue "sha256" -Force
          $conf.bundle.windows | Add-Member -NotePropertyName timestampUrl -NotePropertyValue "http://timestamp.digicert.com" -Force
          $conf | ConvertTo-Json -Depth 32 | Set-Content src-tauri/tauri.conf.json

      - name: Build Tauri NSIS installer
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Public half of the update signing key. When set, this build only installs updates
          # whose release carries a valid `<installer>.sig`.
          PB_UPDATE_PUBLIC_KEY: ${{ vars.PB_UPDATE_PUBLIC_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: "PETABLOCKS Launcher v__VERSION__"
          releaseBody: "Official PETABLOCKS Launcher release. Download the `.exe` installer below."
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

      # Detached Ed25519 signature over the installer's SHA-256, verified by launchers built
      # with PB_UPDATE_PUBLIC_KEY. Enabled by the PB_UPDATE_SIGNING_KEY secret (PEM private key).
      - name: Sign installer for the in-app updater
        if: env.HAS_UPDATE_SIGNING_KEY == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PB_UPDATE_SIGNING_KEY: ${{ secrets.PB_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          TAG="v$(node -p "require('./package.json').version")"
          installer=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -n 1)
          key="$RUNNER_TEMP/update-signing-key.pem"
          printf '%s\n' "$PB_UPDATE_SIGNING_KEY" > "$key"
          printf '%s' "$(sha256sum "$installer" | cut -d' ' -f1)" > "$RUNNER_TEMP/digest.txt"
          openssl pkeyutl -sign -inkey "$key" -rawin -in "$RUNNER_TEMP/digest.txt" -out "$RUNNER_TEMP/sig.bin"
          rm -f "$key"
          openssl base64 -A -in "$RUNNER_TEMP/sig.bin" -out "$installer.sig"
          gh release upload "$TAG" "$installer.sig" --clobber

      # Launcher releases also host the modpack manifests and .mrpack archives so that
      # releases/latest/download/... keeps working. Always copy the newest published modpack
      # release of each pack instead of a pinned version.
      - name: Carry forward the latest modpack manifests and mrpacks
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          # Derived from package.json so it also works for manually dispatched runs.
          TAG="v$(node -p "require('./package.json').version")"
          mkdir -p carry && cd carry
          for prefix in s2-v create2-v; do
            latest=$(gh release list --repo Petablocks/pb-modpacks --limit 100 \
              --json tagName,isDraft,isPrerelease \
              --jq "[.[] | select((.isDraft or .isPrerelease) | not) | .tagName | select(startswith(\"$prefix\"))][0] // empty")
            if [ -z "$latest" ]; then
              echo "::warning::No published pb-modpacks release found for prefix $prefix"
              continue
            fi
            echo "Carrying forward $latest"
            gh release download "$latest" --repo Petablocks/pb-modpacks \
              -p "*.mrpack" -p "launcher-manifest*.json" --clobber \
              || echo "::warning::Could not download assets from $latest"
          done
          for f in *.mrpack launcher-manifest*.json; do
            [ -f "$f" ] || continue
            echo "Uploading $f to $TAG"
            gh release upload "$TAG" "$f" --clobber || echo "::warning::Upload of $f failed"
          done
