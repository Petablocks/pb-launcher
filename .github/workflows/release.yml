name: Release Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust stable (MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.5
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit npm dependencies (high/critical)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Verify versions match (tag, package.json, Cargo.toml, tauri.conf.json, version.ts)
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          grep -q "^version = \"$v\"" src-tauri/Cargo.toml || { echo "Cargo.toml version != $v"; exit 1; }
          grep -q "\"version\": \"$v\"" src-tauri/tauri.conf.json || { echo "tauri.conf.json version != $v"; exit 1; }
          grep -q "\"$v\"" src/version.ts || { echo "src/version.ts version != $v"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$v" ]]; then echo "Tag $GITHUB_REF_NAME != v$v"; exit 1; fi

      - name: Typecheck frontend
        run: npx tsc -b

      - name: Run Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri NSIS installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "PETABLOCKS Launcher v__VERSION__"
          releaseBody: "Official PETABLOCKS Launcher release. Download the `.exe` installer below."
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Carry forward modpack manifests and mrpacks to new release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "Carrying forward modpack bundles to $TAG..."
          # Download public manifests and mrpacks from pb-modpacks
          gh release download s2-v0.22.0 --repo Petablocks/pb-modpacks -p "PETABLOCKS-Season-2-0.22.0.mrpack" -p "launcher-manifest.json" --clobber || true
          gh release download create2-v1.4.1 --repo Petablocks/pb-modpacks -p "PETABLOCKS-Create-2-1.4.1.mrpack" -p "launcher-manifest-create2.json" --clobber || true
          # Upload them to this new release so releases/latest/download always has them
          for f in PETABLOCKS-Season-2-*.mrpack PETABLOCKS-Create-2-*.mrpack launcher-manifest*.json; do
            if [ -f "$f" ]; then
              echo "Uploading $f to $TAG..."
              gh release upload "$TAG" "$f" --clobber || true
            fi
          done
