[package]
name = "pb-launcher"
version = "1.15.0"
description = "Official PETABLOCKS Minecraft Launcher"
edition = "2021"

[lib]
name = "pb_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
tokio = { version = "1", features = ["time", "fs", "sync", "process", "io-util", "net", "macros"] }
keyring = { version = "3", features = ["windows-native"] }
tauri-plugin-opener = "2"
sha1 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
dirs = "5"
tauri-plugin-single-instance = "2"
sha2 = "0.10"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }


